name: Build Aanaristays Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify uploaded source files
        run: |
          test -f Aanaristays_Android.html || { echo 'ERROR: Aanaristays_Android.html is missing from the repository root.'; exit 1; }
          test -f Aanaristays_Android_Build_Source.zip || { echo 'ERROR: Aanaristays_Android_Build_Source.zip is missing from the repository root.'; exit 1; }

      - name: Extract Android project template
        run: |
          mkdir -p app-source
          unzip -q Aanaristays_Android_Build_Source.zip -d app-source
          test -f app-source/package.json || { echo 'ERROR: package.json is missing inside the source ZIP.'; exit 1; }
          test -f app-source/www/index.html || { echo 'ERROR: www/index.html is missing inside the source ZIP.'; exit 1; }
          cp Aanaristays_Android.html app-source/www/index.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install npm dependencies
        working-directory: app-source
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: app-source
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: app-source/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload Aanaristays APK
        uses: actions/upload-artifact@v4
        with:
          name: Aanaristays-Android-APK
          path: app-source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
